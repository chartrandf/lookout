[package]
name = "lookout"
version = "0.4.15"
description = "Desktop overview of your Claude Code review sessions across GitHub PRs"
authors = ["Francis Chartrand"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lookout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.5.1"
tauri-plugin-store = "2.4.3"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.1"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
# the CLI bridge socket (unix only: macOS + Linux)
tokio = { version = "1", features = ["net", "io-util", "sync"] }
log = "0.4"


# native macOS notifications (UNUserNotificationCenter): the notification plugin posts through the
# deprecated NSUserNotificationCenter, which never registers the app, so release builds stay silent
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

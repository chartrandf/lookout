name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Lookout ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          args: --target universal-apple-darwin --bundles app,dmg
          releaseBody: |
            Universal macOS build (Apple Silicon + Intel).

            This app is **not signed or notarized**, so macOS will refuse to open
            it on the first try. To install:

            1. Open the `.dmg` and drag **Lookout** to Applications.
            2. Run once in Terminal:
               ```
               xattr -dr com.apple.quarantine /Applications/Lookout.app
               ```
            3. Launch normally.

            Alternatively, double-click the app, then go to
            **System Settings → Privacy & Security** and click **Open Anyway**.

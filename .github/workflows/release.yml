name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # Creates the release up front so the macOS and Linux builds can run in parallel and only upload
  # to it (tauri-action finds it by tag). `view ||` keeps a workflow_dispatch re-run from failing.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: create the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && exit 0
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "Lookout $TAG" "${flags[@]}" --notes-file - <<'EOF'
          <details>
          <summary><b>Install on macOS</b></summary>

          Universal build (Apple Silicon + Intel), macOS 11+.

          **Homebrew** (recommended — no Gatekeeper prompt, puts `lookout` CLI on PATH):

          ```bash
          brew tap chartrandf/lookout https://github.com/chartrandf/lookout
          brew trust --cask chartrandf/lookout/lookout
          brew install --cask lookout
          ```

          All three lines, in order. Upgrade later with `brew upgrade --cask lookout`.

          **Manual** (`.dmg`) — the app is ad-hoc signed but **not notarized**:

          1. Download `Lookout_*_universal.dmg` below, open it, drag **Lookout** to Applications.
          2. Double-click it — the launch is blocked.
          3. **System Settings → Privacy & Security → Open Anyway** (one-time).

          Or from Terminal: `xattr -dr com.apple.quarantine /Applications/Lookout.app`.

          </details>

          <details>
          <summary><b>Install on Linux</b></summary>

          x86_64 only. Needs webkit2gtk-4.1 (Ubuntu 22.04+, Debian 12+).

          **Debian / Ubuntu** (`.deb`):

          ```bash
          sudo apt install ./Lookout_*_amd64.deb
          ```

          **Other distros** (`.AppImage`):

          ```bash
          chmod +x Lookout_*_amd64.AppImage
          ./Lookout_*_amd64.AppImage
          ```

          </details>
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          args: --target universal-apple-darwin --bundles app,dmg

      # The bundle is ad-hoc signed by the bundler (tauri.conf.json > macOS.signingIdentity "-").
      # Verify it deeply — an invalid signature is what makes macOS call an app "damaged", and a
      # future nested dylib/sidecar would show up here rather than on someone's Mac.
      - name: verify code signature
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Lookout.app
          codesign -dv --verbose=2 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      # This repo doubles as the Homebrew tap: point the cask at the release we just cut. The sha256
      # is only knowable now, so it lands on main right after the build (the version came from
      # `pnpm version`, so usually only the hash actually changes).
      # Skipped for prerelease tags (v1.2.3-rc.1): the bundle is named after tauri.conf.json's
      # version, not the tag, so the cask URL would point at a missing .dmg.
      - name: update the Homebrew cask
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        run: |
          version="${TAG#v}"
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          echo "$dmg -> $sha"
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD
          sed -i '' -E "s/^  version \".*\"$/  version \"${version}\"/" Casks/lookout.rb
          sed -i '' -E "s/^  sha256 \".*\"$/  sha256 \"${sha}\"/" Casks/lookout.rb
          if git diff --quiet Casks/lookout.rb; then
            echo "cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "chore(cask): lookout ${version}" Casks/lookout.rb
          git push origin main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

  # 22.04 is the oldest runner with webkit2gtk-4.1: an older glibc keeps the .deb/AppImage
  # runnable on more distros.
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          args: --bundles deb,appimage

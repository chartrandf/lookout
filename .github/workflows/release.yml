name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Lookout ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          args: --target universal-apple-darwin --bundles app,dmg
          releaseBody: |
            Universal macOS build (Apple Silicon + Intel).

            The app is ad-hoc signed but **not notarized**, so macOS blocks the
            first launch. No Terminal needed:

            1. Open the `.dmg` and drag **Lookout** to Applications.
            2. Double-click it — the launch is blocked.
            3. **System Settings → Privacy & Security → Open Anyway**.

            One-time click. Prefer the command line? `xattr -dr
            com.apple.quarantine /Applications/Lookout.app` does the same.

      # The bundle is ad-hoc signed by the bundler (tauri.conf.json > macOS.signingIdentity "-").
      # Verify it deeply — an invalid signature is what makes macOS call an app "damaged", and a
      # future nested dylib/sidecar would show up here rather than on someone's Mac.
      - name: verify code signature
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Lookout.app
          codesign -dv --verbose=2 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      # This repo doubles as the Homebrew tap: point the cask at the release we just cut. The sha256
      # is only knowable now, so it lands on main right after the build (the version came from
      # `pnpm version`, so usually only the hash actually changes).
      - name: update the Homebrew cask
        run: |
          version="${TAG#v}"
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          echo "$dmg -> $sha"
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD
          sed -i '' -E "s/^  version \".*\"$/  version \"${version}\"/" Casks/lookout.rb
          sed -i '' -E "s/^  sha256 \".*\"$/  sha256 \"${sha}\"/" Casks/lookout.rb
          if git diff --quiet Casks/lookout.rb; then
            echo "cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "chore(cask): lookout ${version}" Casks/lookout.rb
          git push origin main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
